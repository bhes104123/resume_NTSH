<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神</title>

    <style>
        body {
            margin: 0;
            font-family: "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
        }

        header {
            background-color: #1565c0;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 原神</h1>
    <p>原神遊戲專區</p>
</header>

<div class="container">
    <div class="card">
        <h2>原神</h2>
        <p>歡迎來到我的原神專區！</p>

        <!-- 之後可以在這裡增加原神內容 -->

        <a class="back" href="/">← 回到首頁</a>
    </div>
</div>

</body>
</html>
